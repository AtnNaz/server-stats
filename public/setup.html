<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="setup.title">İlk kurulum · Node Stats</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js" defer></script>
  <script src="/setup.js" defer></script>
</head>
<body>
  <main class="login">
    <section class="login-brand" aria-hidden="true">
      <div class="brand-mark">
        <span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 12.5h4l2.5-6 4 13 2.5-7 1.5 2H21"/></svg></span>
        <span><span data-i18n="app.name">Node Stats</span></span>
      </div>
      <div class="brand-copy">
        <h2 data-i18n="setup.brandTitle">Hoş geldiniz.</h2>
        <p><span data-i18n="setup.brandText">Birkaç adımda yönetici hesabınızı oluşturun; panel hemen sunucunuzu izlemeye başlar.</span></p>
      </div>
      <ol class="setup-track" id="setup-track"></ol>
    </section>

    <section class="login-panel">
      <form id="setup-form" class="login-card setup-card" novalidate>
        <span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 12.5h4l2.5-6 4 13 2.5-7 1.5 2H21"/></svg></span>
        <p class="setup-step-label" id="setup-step-label"></p>
        <h1 id="setup-heading"></h1>
        <p class="sub" id="setup-sub"></p>

        <div id="setup-alert" class="alert" role="alert" hidden>
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>
          <span id="setup-alert-text"></span>
        </div>

        <div id="setup-body"></div>

        <div class="setup-actions">
          <button type="button" id="setup-back" class="btn" hidden><span data-i18n="setup.back">Geri</span></button>
          <button type="submit" id="setup-next" class="btn-primary">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label" id="setup-next-label"></span>
          </button>
        </div>

        <p id="conn-note" class="conn-note">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/></svg>
          <span id="conn-note-text"></span>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
